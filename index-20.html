<style>

</style></head><body><main>

<script>
const $=s=>document.querySelector(s),R=Math.PI/180,DM=864e5,H1=36e5,E=R*23.4397,TP=2*Math.PI;
const pad=n=>String(n).padStart(2,'0'),hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const dd=t=>t/DM-.5+2440588-2451545;
const RA=(l,b)=>Math.atan2(Math.sin(l)*Math.cos(E)-Math.tan(b)*Math.sin(E),Math.cos(l)),DEC=(l,b)=>Math.asin(Math.sin(b)*Math.cos(E)+Math.cos(b)*Math.sin(E)*Math.sin(l));
const sunL=d=>{const M=R*(357.5291+.98560028*d);return M+R*(1.9148*Math.sin(M)+.02*Math.sin(2*M)+.0003*Math.sin(3*M))+R*102.9372+Math.PI};
const moonL=d=>{const L=R*(218.316+13.176396*d),M=R*(134.963+13.064993*d);return L+R*6.289*Math.sin(M)};
let loc={lat:43.55,lng:10.31},D=null,day=0,sp='spigola',TH={w:20,h:1.5};
try{const x=JSON.parse(localStorage.getItem('mg_th'));if(x&&x.w>0&&x.h>0)TH=x}catch(e){}
try{const s=JSON.parse(localStorage.getItem('mg_loc'));if(s&&s.lat)loc=s}catch(e){}
function body(w,t){const d=dd(t);let ra,de;if(w=='s'){const l=sunL(d);ra=RA(l,0);de=DEC(l,0)}else{const L=R*(218.316+13.176396*d),M=R*(134.963+13.064993*d),F=R*(93.272+13.22935*d),l=L+R*6.289*Math.sin(M),b=R*5.128*Math.sin(F);ra=RA(l,b);de=DEC(l,b)}
const p=R*loc.lat,h=R*(280.16+360.9856235*d)+R*loc.lng-ra;
return{alt:Math.asin(Math.sin(p)*Math.sin(de)+Math.cos(p)*Math.cos(de)*Math.cos(h))/R,az:(Math.atan2(Math.sin(h),Math.cos(h)*Math.sin(p)-Math.tan(de)*Math.cos(p))/R+180+360)%360,H:h}}
const CP=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'],cp=a=>CP[Math.round(a/22.5)%16];
const phase=t=>{const d=dd(t);return((((moonL(d)-sunL(d))/TP)%1)+1)%1};
const pname=p=>p<.03||p>.97?'Luna nuova':p<.22?'Crescente':p<.28?'Primo quarto':p<.47?'Gibbosa crescente':p<.53?'Luna piena':p<.72?'Gibbosa calante':p<.78?'Ultimo quarto':'Calante';
const at=(S,t)=>{if(!S)return null;const i=(t-S.t0)/H1;if(i<0||i>S.v.length-1)return null;const a=Math.floor(i),b=Math.min(a+1,S.v.length-1),x=S.v[a],y=S.v[b];return x==null||y==null?null:x+(y-x)*(i-a)};
const tide=t=>{const v=D.hasSea?at(D.sea,t):null;return v!=null?v:.22*Math.cos(2*body('m',t).H)};

for(let i=1;i<A.length-1;i++){const a=A[i-1],b=A[i],c=A[i+1];
if(b[1]>a[1]&&b[1]>=c[1])o.push({t:b[0],k:'M',n:'Luna al culmine'});else if(b[1]<a[1]&&b[1]<=c[1])o.push({t:b[0],k:'M',n:'Luna sotto i piedi'});
if(a[1]<0&&b[1]>=0)o.push({t:b[0],k:'m',n:'Sorge la luna'});if(a[1]>=0&&b[1]<0)o.push({t:b[0],k:'m',n:'Tramonta la luna'});
if(a[2]<-.8&&b[2]>=-.8)o.push({t:b[0],k:'S',n:'Alba'});if(a[2]>=-.8&&b[2]<-.8)o.push({t:b[0],k:'S',n:'Tramonto'})}

const SP={spigola:{n:'Spigola',L:[1,.75,.3],w:[.4,1.6],pf:1},serra:{n:'Serra',L:[1,.55,.4],w:[0,1],pf:1},orata:{n:'Orata',L:[.8,.3,.85],w:[0,.8],pf:0},calamaro:{n:'Calamaro',L:[.8,1,.2],w:[0,.5],pf:0}};

const maxIn=(S,a,b)=>{let m=null,tm=0;for(let t=a;t<=b;t+=H1){const v=at(S,t);if(v!=null&&(m==null||v>m)){m=v;tm=t}}return m==null?null:{m,t:tm}};
const g=id=>{const e=$(id);return e?e.value:null};
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const sunG=`<circle r="7" fill="#f2b84b"/>${[0,45,90,135,180,225,270,315].map(d=>`<line y1="-11" y2="-16" stroke="#f2b84b" stroke-width="2" stroke-linecap="round" transform="rotate(${d})"/>`).join('')}`;
const moonG=p=>{const c=Math.cos(TP*p),rx=Math.abs(16*c).toFixed(2);return `<circle r="16" fill="#1d3a46" stroke="#5a7580"/><g${p>=.5?' transform="scale(-1,1)"':''}><path d="M0 -16A16 16 0 0 1 0 16A${rx} 16 0 0 ${c>0?0:1} 0 -16Z" fill="#f4efd8"/></g>`};
const icon=(g,z)=>`<svg viewBox="-20 -20 40 40" style="width:${z}px;height:${z}px;flex:none" aria-hidden="true">${g}</svg>`;
const skySvg=(ss,ms,ph,tb)=>{const X=a=>130+Math.max(-120,Math.min(120,a-180))/120*100,Y=l=>l>=0?118-l*1.05:118+Math.min(-l,18)*1.3,sk=ss.alt>0?'#1f5568':ss.alt>-6?'#243a52':'#0d212a';
const path=(w,c)=>{let d='',pn=false;for(let m=0;m<=1440;m+=20){const o=body(w,tb+m*6e4);if(o.alt<0){pn=false;continue}d+=(pn?'L':'M')+X(o.az).toFixed(1)+','+Y(o.alt).toFixed(1);pn=true}return d?`<path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-dasharray="3 4" opacity=".6"/>`:''};
return `<svg viewBox="0 0 260 160" role="img" aria-label="Posizione di sole e luna guardando verso sud" style="width:100%;height:auto"><rect x="10" y="8" width="240" height="110" rx="8" fill="${sk}"/><rect x="10" y="118" width="240" height="40" rx="8" fill="#071116"/>${[30,60].map(a=>`<line x1="10" x2="250" y1="${Y(a)}" y2="${Y(a)}" stroke="#fff" stroke-opacity=".12" stroke-dasharray="2 4"/><text x="14" y="${Y(a)-3}" fill="#8fa9b0" font-size="9">${a}°</text>`).join('')}<line x1="10" x2="250" y1="118" y2="118" stroke="#8fa9b0"/>${path('s','#f2b84b')}${path('m','#f4efd8')}<g transform="translate(${X(ss.az)} ${Y(ss.alt)}) scale(.8)" opacity="${ss.alt>=0?1:.45}">${sunG}</g><g transform="translate(${X(ms.az)} ${Y(ms.alt)}) scale(.8)" opacity="${ms.alt>=0?1:.45}">${moonG(ph)}</g>${[['Est',55],['Sud',130],['Ovest',205]].map(([l,x])=>`<text x="${x}" y="154" fill="#8fa9b0" font-size="11" text-anchor="middle">${l}</text>`).join('')}</svg>`};
const daybar=(t0,ev,now)=>{const W=340,P=8,U=W-2*P,w=U/24,X=t=>P+(t-t0)/DM*U,tt=(y,x)=>`<text x="${P}" y="${y}" fill="#e6f0ee" font-size="12" font-weight="600">${x}</text>`,

for(let h=0;h<24;h++){const sa=body('s',t0+h*H1+H1/2).alt;s+=`<rect x="${P+h*w}" y="20" width="${w+.5}" height="22" fill="${sa>0?'#e0b040':sa>-6?'#6b5b7b':'#12222d'}"/>`}
const a1=fi('Alba'),a2=fi('Tramonto');if(a1)s+=lab(a1.t,'🌅 '+hm(a1.t),58);if(a2)s+=lab(a2.t,'🌇 '+hm(a2.t),58);
s+=tt(80,'🌙 Luna sopra l’orizzonte');
for(let h=0;h<24;h++){const ma=body('m',t0+h*H1+H1/2).alt;s+=`<rect x="${P+h*w}" y="87" width="${w+.5}" height="22" fill="${ma>0?'#f4efd8':'#12222d'}"/>`}
const m1=fi('Sorge la luna'),m2=fi('Tramonta la luna');if(m1)s+=lab(m1.t,'↑ sorge '+hm(m1.t),125);if(m2)s+=lab(m2.t,'↓ tramonta '+hm(m2.t),125);
s+=tt(147,'🎣 Momenti favorevoli')+`<rect x="${P}" y="154" width="${U}" height="22" fill="#12222d"/>`;

const solu=(ev,t0,now,day)=>{const P=ev.filter(e=>e.k!='S').map(e=>{const d=e.k=='M'?H1:H1/2;return{a:Math.max(t0,e.t-d),b:Math.min(t0+DM,e.t+d),k:e.k}}).filter(p=>p.b>p.a).sort((x,y)=>x.a-y.a),f=k=>P.filter(p=>p.k==k).map(p=>hm(p.a)+'–'+hm(p.b)).join(' · ')||'nessuno';

xs.forEach(q=>{let d2='',pn=false;q.v.forEach((x,i)=>{if(x==null){pn=false;return}d2+=(pn?'L':'M')+X(i)+','+Y(x);pn=true});if(d2)s+=`<path d="${d2}" fill="none" stroke="${q.c}" stroke-width="2" stroke-dasharray="5 3"/>`});
